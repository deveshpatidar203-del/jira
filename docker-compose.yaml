services:
  jira:
    build:
      context: .
      dockerfile: Dockerfile.jira
    ports:
      - "7070:8080"
    env_file:
      - .env
    networks:
      - mynetwork1
  mysql:
    image: mysql:8.0
    volumes:
      - myvolume1:/var/lib/mysql
    env_file:
      - .env
    networks:
      - mynetwork1
  pma:
    image: phpmyadmin:latest
    ports:
      - "7071:80"
    env_file:
      - .env
    networks:
      - mynetwork1
      
networks:
  mynetwork1:
volumes:
  myvolume1:  

   
